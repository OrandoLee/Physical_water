<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 水体沙盒</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const isBuiltHtml = Boolean(document.querySelector('script[src^="./assets/"]'))
      if (window.location.protocol === 'file:' && !isBuiltHtml) {
        document.documentElement.style.background = '#061016'
        document.body.style.margin = '0'
        document.body.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:32px;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,rgba(76,229,255,.18),transparent 34%),#061016;color:#ecfbff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
            <section style="max-width:720px;border:1px solid rgba(145,234,255,.25);border-radius:10px;background:rgba(5,14,20,.68);box-shadow:0 24px 80px rgba(0,0,0,.36);padding:28px">
              <h1 style="margin:0 0 12px;font-size:28px;letter-spacing:0">3D 水体沙盒</h1>
              <p style="margin:0 0 16px;line-height:1.6;color:rgba(236,251,255,.78)">这是 Vite 源码入口。请通过开发服务器打开，或者先构建后再打开构建产物。</p>
              <pre style="white-space:pre-wrap;margin:0 0 16px;padding:14px;border-radius:8px;background:rgba(255,255,255,.07);color:#86f3ff">npm install
npm run dev</pre>
              <p style="margin:0;line-height:1.6;color:rgba(236,251,255,.78)">如果要直接双击文件预览，请先运行 <b>npm run build</b>，再打开 <b>dist/index.html</b>。</p>
            </section>
          </main>
        `
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
